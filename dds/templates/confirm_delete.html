{% extends 'base.html' %}
{% block content %}
  <h2>Удалить объект?</h2>
  <p>Вы уверены, что хотите удалить "{{ object }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="/" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
